name: Fork Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        type: choice
        default: macos-universal
        options:
          - macos-universal
          - windows-x64
          - linux-x64
          - all

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Rust tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-fork-build-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-fork-build-cargo-

      - name: Check formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust tests
        run: |
          mkdir -p dist
          cargo test --manifest-path src-tauri/Cargo.toml

  build-macos:
    name: Build macOS universal
    needs: verify
    if: inputs.target == 'macos-universal' || inputs.target == 'all'
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-fork-build-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-fork-build-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned universal macOS app
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg --config .github/tauri.unsigned.conf.json

      - name: Package app bundle for download
        run: |
          mkdir -p unsigned-artifacts
          APP_PATH=$(find src-tauri/target -path '*/bundle/macos/*.app' -type d | head -n 1)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" unsigned-artifacts/CC-Switch-macos-universal.zip
          find src-tauri/target -path '*/bundle/dmg/*.dmg' -type f -exec cp {} unsigned-artifacts/ \;

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-macos-universal-unsigned
          path: unsigned-artifacts/*
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows x64
    needs: verify
    if: inputs.target == 'windows-x64' || inputs.target == 'all'
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned Windows installer
        run: pnpm tauri build --bundles msi --config .github/tauri.unsigned.conf.json

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-windows-x64-unsigned
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux x64
    needs: verify
    if: inputs.target == 'linux-x64' || inputs.target == 'all'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file patchelf libssl-dev rpm \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned Linux packages
        run: pnpm tauri build --bundles appimage,deb,rpm --config .github/tauri.unsigned.conf.json

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-linux-x64-unsigned
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14
